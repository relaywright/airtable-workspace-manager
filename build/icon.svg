    <rect width="1024" height="1024" rx="224" fill="url(#tile)"/>
    <rect x="192" y="208" width="512" height="176" rx="56" fill="#e2e8f0"/>
    <rect x="256" y="424" width="512" height="176" rx="56" fill="#e2e8f0"/>
    <rect x="320" y="640" width="512" height="176" rx="56" fill="#e2e8f0"/>
    <path d="M416 280 V448 Q416 512 480 512 H544 Q608 512 608 576 V744" fill="none" stroke="#6366f1" stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
