version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # eslint and @eslint/js must move together; a lone @eslint/js major breaks npm ci.
      eslint:
        patterns:
          - eslint
          - '@eslint/*'
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # eslint-plugin-react 7.37.5 (latest) only accepts eslint up to 9; drop once it supports 10.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
