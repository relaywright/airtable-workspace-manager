version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # eslint and @eslint/js must move together; a lone @eslint/js major breaks npm ci.
      eslint:
        patterns:
          - eslint
          - "@eslint/*"
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
